<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AQM Online — Ai Quality Management</title>
  <meta name="description" content="AQM Online — Ai Quality Management. Under construction, see you soon.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070707;
      --fg: #f5f5f5;
      --muted: #8f8f8f;
      --line: rgba(255, 255, 255, 0.14);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow: hidden;
      position: relative;
    }
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 60% 50% at 50% 35%, rgba(255, 255, 255, 0.07), transparent 70%);
      pointer-events: none;
    }
    main {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 640px;
    }
    .face {
      display: block;
      width: clamp(170px, 42vw, 250px);
      aspect-ratio: 46 / 57;
      margin: 0 auto 20px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 14px;
      margin-bottom: 24px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--fg);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      50% { opacity: 0.3; }
    }
    h1 {
      font-size: clamp(2.6rem, 9vw, 4.5rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.03em;
      background: linear-gradient(120deg, #ffffff 35%, #7a7a7a);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .tagline {
      margin-top: 12px;
      font-size: clamp(0.9rem, 2.3vw, 1rem);
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #d4d4d4;
    }
    p {
      margin-top: 20px;
      font-size: clamp(1.05rem, 3vw, 1.3rem);
      color: var(--muted);
      line-height: 1.6;
    }
    p strong { color: var(--fg); font-weight: 600; }
    footer {
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
      z-index: 1;
    }
    @media (max-height: 720px) {
      .face { width: clamp(130px, 30vh, 200px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .dot { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <canvas class="face" id="face" role="img" aria-label="Humanoid robot face drawn in dots"></canvas>
    <span class="badge"><span class="dot"></span>Under construction</span>
    <h1>AQM Online</h1>
    <div class="tagline">Ai Quality Management</div>
    <p>We're building something new.<br><strong>See you soon.</strong></p>
  </main>
  <footer>&copy; <span id="year">2026</span> AQM Online</footer>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    // Humanoid robot face as a halftone dot field. A height map models the
    // face (brow, eye sockets, nose, lips, chin); each dot's size follows its
    // lighting, so the face reads as a lit 3D surface.
    (function () {
      const canvas = document.getElementById("face");
      const ctx = canvas.getContext("2d");
      const COLS = 46, ROWS = 57;
      const U0 = -0.85, U1 = 0.85, V0 = -0.95, V1 = 1.15;
      const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      const g = (u, v, cx, cy, sx, sy, a) =>
        a * Math.exp(-(((u - cx) / sx) ** 2 + ((v - cy) / sy) ** 2));
      const halfWidth = (v, w) => (v < 0.05 ? w : w - 0.5 * Math.pow(v - 0.05, 1.5));
      const headR2 = (u, v) => (u / halfWidth(v, 0.6)) ** 2 + ((v + 0.05) / 0.82) ** 2;

      function height(u, v) {
        const r2 = headR2(u, v);
        if (r2 >= 1) return 0;
        let h = 0.6 * Math.sqrt(1 - r2);
        for (const s of [-1, 1]) {
          h += g(u, v, s * 0.2, -0.15, 0.17, 0.05, 0.09);   // brow
          h += g(u, v, s * 0.21, -0.03, 0.12, 0.065, -0.14); // eye socket
          h += g(u, v, s * 0.32, 0.14, 0.1, 0.08, 0.07);
          h += g(u, v, s * 0.3, 0.38, 0.1, 0.12, -0.05);  // cheek hollow    // cheekbone
        }
        h += g(u, v, 0, 0.12, 0.05, 0.2, 0.12);    // nose bridge
        h += g(u, v, 0, 0.3, 0.08, 0.05, 0.1);     // nose tip
        h += g(u, v, 0, 0.37, 0.1, 0.03, -0.06);  // under nose
        h += g(u, v, 0, 0.44, 0.15, 0.035, 0.05);    // upper lip
        h += g(u, v, 0, 0.49, 0.16, 0.016, -0.1); // mouth line
        h += g(u, v, 0, 0.535, 0.13, 0.03, 0.05);    // lower lip
        h += g(u, v, 0, 0.68, 0.13, 0.07, 0.08);     // chin
        return h;
      }

      const dots = [];
      const e = 0.008;
      for (let j = 0; j < ROWS; j++) {
        for (let i = 0; i < COLS; i++) {
          const u = U0 + (U1 - U0) * i / (COLS - 1);
          const v = V0 + (V1 - V0) * j / (ROWS - 1);
          const d = { i, j, u, v, kind: "bg" };
          const r2 = headR2(u, v);
          if (r2 < 1) {
            const hx = (height(u + e, v) - height(u - e, v)) / (2 * e);
            const hy = (height(u, v + e) - height(u, v - e)) / (2 * e);
            const n = Math.hypot(hx, hy, 1);
            Object.assign(d, { kind: "head", nx: -hx / n, ny: -hy / n, nz: 1 / n, rim: r2 });
            // Face-plate seam, the line that makes it a machine.
            const plate = (u / halfWidth(v + 0.06, 0.47)) ** 2 + ((v - 0.1) / 0.7) ** 2;
            if (Math.abs(plate - 1) < 0.09 && v > -0.45) d.seam = true;
            for (const s of [-1, 1]) {
              if (((u - s * 0.21) / 0.09) ** 2 + ((v + 0.03) / 0.035) ** 2 < 1) d.kind = "eye";
            }
          } else if (v > 0.6 && Math.abs(u) < 0.23) {
            const nx = u / 0.23;
            Object.assign(d, { kind: "neck", nx: nx, ny: 0, nz: Math.sqrt(1 - nx * nx) });
            if (Math.abs(Math.abs(u) - 0.1) < 0.02) d.seam = true;
          }
          dots.push(d);
        }
      }

      let w, h, step;
      function resize() {
        const dpr = window.devicePixelRatio || 1;
        w = canvas.clientWidth; h = canvas.clientHeight;
        canvas.width = w * dpr; canvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        step = w / COLS;
      }

      function draw(t) {
        ctx.clearRect(0, 0, w, h);
        const sway = still ? 0 : Math.sin(t / 2600) * 0.35;
        let lx = -0.35 + sway, ly = -0.3, lz = 0.9;
        const ln = Math.hypot(lx, ly, lz); lx /= ln; ly /= ln; lz /= ln;
        const scan = still ? -9 : V0 - 0.3 + ((t / 4500) % 1) * (V1 - V0 + 0.6);
        const eyeGlow = still ? 1 : 0.8 + 0.2 * Math.sin(t / 700);
        const maxR = step * 0.46;

        for (const d of dots) {
          const x = (d.i + 0.5) * step, y = (d.j + 0.5) * step;
          let b;
          if (d.kind === "bg") {
            const fade = Math.max(0, 1 - Math.hypot(d.u, (d.v - 0.1) * 0.8) / 1.2);
            b = 0.05 * fade;
          } else if (d.kind === "eye") {
            continue;
          } else {
            const diff = Math.max(0, d.nx * lx + d.ny * ly + d.nz * lz);
            const rz = 2 * diff * d.nz - lz;
            const spec = Math.pow(Math.max(0, rz), 18) * 0.55;
            b = 0.02 + 0.85 * Math.pow(diff, 1.4) + spec;
            if (d.kind === "head") b *= 1 - 0.55 * Math.pow(d.rim, 4);
            if (d.kind === "neck") b *= 0.6 * Math.max(0, Math.min(1, 1 - (d.v - 0.85) / 0.3));
            if (d.seam) b *= 0.3;
          }
          b += 0.35 * Math.exp(-((d.v - scan) ** 2) / 0.0025) * (d.kind === "bg" ? 0.15 : 1);
          b = Math.min(1, b);
          const r = Math.max(0.5, maxR * Math.sqrt(b));
          ctx.fillStyle = "rgba(255,255,255," + (0.18 + 0.82 * b).toFixed(3) + ")";
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.save();
        ctx.shadowColor = "rgba(255,255,255,0.9)";
        ctx.shadowBlur = step * 1.6 * eyeGlow;
        ctx.fillStyle = "rgba(255,255,255," + eyeGlow.toFixed(3) + ")";
        for (const d of dots) {
          if (d.kind !== "eye") continue;
          ctx.beginPath();
          ctx.arc((d.i + 0.5) * step, (d.j + 0.5) * step, maxR * 0.95, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      resize();
      window.addEventListener("resize", () => { resize(); if (still) draw(0); });
      if (still) draw(0);
      else requestAnimationFrame(function loop(t) { draw(t); requestAnimationFrame(loop); });
    })();
  </script>
</body>
</html>
