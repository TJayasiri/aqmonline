<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AQM Online — AI Quality Management</title>
  <meta name="description" content="AQM Online — AI Quality Management. Under construction, see you soon.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1020;
      --fg: #f4f6fb;
      --muted: #9aa3b8;
      --accent: #4f8cff;
      --accent-2: #33d6a6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow: hidden;
      position: relative;
    }
    .glow {
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.35;
      z-index: 0;
      animation: drift 14s ease-in-out infinite alternate;
    }
    .glow.one { background: var(--accent); top: -200px; left: -150px; }
    .glow.two { background: var(--accent-2); bottom: -220px; right: -150px; animation-delay: -7s; }
    @keyframes drift {
      to { transform: translate(80px, 60px) scale(1.1); }
    }
    main {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 640px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      padding: 6px 14px;
      margin-bottom: 28px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-2);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      50% { opacity: 0.3; }
    }
    h1 {
      font-size: clamp(2.6rem, 9vw, 4.5rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.03em;
      background: linear-gradient(120deg, var(--fg) 30%, var(--accent) 70%, var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p {
      margin-top: 20px;
      font-size: clamp(1.05rem, 3vw, 1.3rem);
      color: var(--muted);
      line-height: 1.6;
    }
    p strong { color: var(--fg); font-weight: 600; }
    .tagline {
      margin-top: 12px;
      font-size: clamp(0.9rem, 2.3vw, 1rem);
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--accent-2);
    }
    footer {
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
      z-index: 1;
    }
    @media (prefers-reduced-motion: reduce) {
      .glow, .dot { animation: none; }
    }
  </style>
</head>
<body>
  <div class="glow one"></div>
  <div class="glow two"></div>
  <main>
    <span class="badge"><span class="dot"></span>Under construction</span>
    <h1>AQM Online</h1>
    <div class="tagline">Ai Quality Management</div>
    <p>We're building something new.<br><strong>See you soon.</strong></p>
  </main>
  <footer>&copy; <span id="year">2026</span> AQM Online</footer>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
